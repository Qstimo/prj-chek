# Локальный оверрайд: compose подхватывает этот файл сам, без указания -f.
#
# Здесь лежит то, что нужно машине разработчика и вредно на сервере: порт базы
# наружу. Миграции и интеграционные тесты запускаются с хоста и ходят в базу
# напрямую, а на сервере база должна быть доступна только по внутренней сети
# Compose. Развёртывание (`scripts/deploy.sh`) поэтому запускает compose с явным
# `-f docker-compose.yml` — этот файл в сборку не попадает.
services:
  postgres:
    ports:
      # Порт вынесен в переменную: на машине разработчика 5432 часто занят
      # системным PostgreSQL.
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
