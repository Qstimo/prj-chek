services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cairn
      POSTGRES_USER: cairn_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан}
      CAIRN_APP_PASSWORD: ${CAIRN_APP_PASSWORD:?CAIRN_APP_PASSWORD не задан}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    # Порт наружу не публикуется: приложение ходит в базу по внутренней сети
    # Compose. Локальной разработке порт нужен (миграции и тесты запускаются
    # с хоста) — его добавляет docker-compose.override.yml, который compose
    # подхватывает сам, а `scripts/deploy.sh` запускает сборку без него.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cairn_owner -d cairn']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    # Имя образа задано явно, а не выведено из имени каталога: `scripts/deploy.sh`
    # помечает им предыдущую сборку (`cairn-api:previous`), и откат возвращает
    # тот же образ независимо от того, как называется каталог на сервере.
    image: cairn-api:latest
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://cairn_app:${CAIRN_APP_PASSWORD:?}@postgres:5432/cairn
      DATABASE_OWNER_URL: postgres://cairn_owner:${POSTGRES_PASSWORD:?}@postgres:5432/cairn
      CAIRN_ENCRYPTION_KEY: ${CAIRN_ENCRYPTION_KEY:?CAIRN_ENCRYPTION_KEY не задан}
      CAIRN_WEB_URL: ${CAIRN_WEB_URL:-http://localhost}
      # Уведомления о падении. Без всех трёх ключей выключены целиком:
      # пара генерируется `pnpm --filter @cairn/api cli generate-vapid-keys`.
      CAIRN_VAPID_PUBLIC_KEY: ${CAIRN_VAPID_PUBLIC_KEY:-}
      CAIRN_VAPID_PRIVATE_KEY: ${CAIRN_VAPID_PRIVATE_KEY:-}
      CAIRN_VAPID_SUBJECT: ${CAIRN_VAPID_SUBJECT:-}
      # Автопроверки статуса. Переменные перечислены здесь все до одной:
      # процесс в контейнере видит только то, что ему передали, а
      # `CAIRN_STATUS_CHECK_INTERVAL_MINUTES` не передавалась — интервал в
      # развёртывании всегда был пятнадцатиминутным, хотя README описывал
      # настройку как рабочую.
      CAIRN_STATUS_CHECK_INTERVAL_MINUTES: ${CAIRN_STATUS_CHECK_INTERVAL_MINUTES:-15}
      CAIRN_HEALTH_RECHECK_DELAY_SECONDS: ${CAIRN_HEALTH_RECHECK_DELAY_SECONDS:-30}
      CAIRN_HEALTH_CHECK_TIMEOUT_SECONDS: ${CAIRN_HEALTH_CHECK_TIMEOUT_SECONDS:-10}
      CAIRN_TLS_CHECK_TIMEOUT_SECONDS: ${CAIRN_TLS_CHECK_TIMEOUT_SECONDS:-10}
      CAIRN_DNS_TIMEOUT_SECONDS: ${CAIRN_DNS_TIMEOUT_SECONDS:-10}
      CAIRN_DNS_TRIES: ${CAIRN_DNS_TRIES:-2}
      CAIRN_RDAP_TIMEOUT_SECONDS: ${CAIRN_RDAP_TIMEOUT_SECONDS:-10}
      CAIRN_RDAP_CACHE_HOURS: ${CAIRN_RDAP_CACHE_HOURS:-24}
      # Разбивка саммари на задачи. Переменные перечислены все семь по той
      # же причине, что и у автопроверок: процесс в контейнере видит
      # только то, что ему передали.
      #
      # Без ключа при `external` порт выключен: на свежей установке текст
      # наружу не уходит до того, как ключ впишут руками.
      #
      # У адреса умолчания здесь нет намеренно, и это не пропуск.
      # Подставить внешний адрес значило бы отправить текст наружу у
      # установки с `local`, у которой адрес не задан, — ровно та подмена
      # названной границы передачи данных, которую запрещает дизайн.
      # Поэтому адрес внешнего API живёт в `.env.example` заполненным
      # значением: приложение умолчание тоже подставляет, но только когда
      # переменной нет вовсе, а compose всегда передаёт её — пустой.
      #
      # И главное про все семь переменных узла: они — **запасной
      # источник**. Настройка с экрана «Модели» лежит в базе и перебивает
      # их целиком, пока запись не удалят кнопкой «Вернуть настройку
      # окружения». Правка этого файла на установке, настроенной с
      # экрана, не даст ничего — и экран прямо об этом говорит.
      CAIRN_TASK_SUGGESTER: ${CAIRN_TASK_SUGGESTER:-external}
      CAIRN_TASK_SUGGESTER_BASE_URL: ${CAIRN_TASK_SUGGESTER_BASE_URL:-}
      # Схема авторизации и каталог передаются здесь по тому же правилу,
      # что остальные: пропущенная в compose переменная уже стоила
      # проекту дефекта. Умолчание схемы — bearer, у каталога умолчания
      # нет: он нужен только службам Yandex.
      CAIRN_TASK_SUGGESTER_AUTH_SCHEME: ${CAIRN_TASK_SUGGESTER_AUTH_SCHEME:-bearer}
      CAIRN_TASK_SUGGESTER_FOLDER: ${CAIRN_TASK_SUGGESTER_FOLDER:-}
      CAIRN_TASK_SUGGESTER_API_KEY: ${CAIRN_TASK_SUGGESTER_API_KEY:-}
      CAIRN_TASK_SUGGESTER_MODEL: ${CAIRN_TASK_SUGGESTER_MODEL:-gpt-4o-mini}
      CAIRN_TASK_SUGGESTER_TIMEOUT_SECONDS: ${CAIRN_TASK_SUGGESTER_TIMEOUT_SECONDS:-60}
      CAIRN_TASK_SUGGESTER_MAX_CHARS: ${CAIRN_TASK_SUGGESTER_MAX_CHARS:-40000}
      CAIRN_TASK_SUGGESTER_MAX_TASKS: ${CAIRN_TASK_SUGGESTER_MAX_TASKS:-50}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Свой адрес живости: у него нет ни аутентификации, ни обращения к базе.
      # fetch есть в Node 22 — лишних утилит в образе не требуется.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      # Первая сборка NestJS поднимается небыстро; до конца этого срока
      # неудачные проверки не считаются падением.
      start_period: 30s
    restart: unless-stopped

  web:
    image: cairn-web:latest
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      CAIRN_INTERNAL_API_URL: http://api:3001/api
      CAIRN_ALLOW_INSECURE_NO_TOTP: ${CAIRN_ALLOW_INSECURE_NO_TOTP:-}
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # Любой ответ, кроме серверной ошибки, означает, что Next обслуживает
      # запросы: корень отдаёт переадресацию на вход, и это нормальное состояние.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  proxy:
    image: caddy:2-alpine
    ports:
      # Порты вынесены в переменные по той же причине, что и порт базы:
      # на машине разработчика 80 и 443 часто заняты другим прокси.
      - '${CAIRN_HTTP_PORT:-80}:80'
      - '${CAIRN_HTTPS_PORT:-443}:443'
    environment:
      CAIRN_DOMAIN: ${CAIRN_DOMAIN:-localhost}
      # http по умолчанию: на localhost автоматический HTTPS дал бы
      # самоподписанный сертификат и ошибку в браузере.
      CAIRN_SCHEME: ${CAIRN_SCHEME:-http}
      # Поддомен соседнего приложения «100 дней до». Непустое значение по
      # умолчанию: пустой адрес сайта Caddy принял бы за блок глобальных
      # настроек и упал бы на `handle`.
      HD_NEIGHBOR_SITE: ${HD_NEIGHBOR_SITE:-hundred-days.localhost}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    networks:
      # Своя сеть перечислена явно: как только у службы появляется список
      # сетей, compose перестаёт подключать её к сети проекта сам, и прокси
      # потерял бы из виду web и api.
      - default
      - hd-edge
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

networks:
  # Общая сеть с соседним стеком «100 дней до»: он подключается к ней как к
  # внешней и получает в ней имя hundred-days, а наружу не публикует ничего.
  #
  # Создаёт сеть этот стек, а не сосед, и это направление выбрано нарочно:
  # CAIRN не должен падать из-за того, что соседа ещё не развернули.
  hd-edge:
    name: hundred-days-edge

volumes:
  postgres-data:
  caddy-data:
