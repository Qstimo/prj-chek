services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cairn
      POSTGRES_USER: cairn_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан}
      CAIRN_APP_PASSWORD: ${CAIRN_APP_PASSWORD:?CAIRN_APP_PASSWORD не задан}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    # Порт наружу не публикуется: приложение ходит в базу по внутренней сети
    # Compose. Локальной разработке порт нужен (миграции и тесты запускаются
    # с хоста) — его добавляет docker-compose.override.yml, который compose
    # подхватывает сам, а `scripts/deploy.sh` запускает сборку без него.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cairn_owner -d cairn']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    # Имя образа задано явно, а не выведено из имени каталога: `scripts/deploy.sh`
    # помечает им предыдущую сборку (`cairn-api:previous`), и откат возвращает
    # тот же образ независимо от того, как называется каталог на сервере.
    image: cairn-api:latest
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://cairn_app:${CAIRN_APP_PASSWORD:?}@postgres:5432/cairn
      DATABASE_OWNER_URL: postgres://cairn_owner:${POSTGRES_PASSWORD:?}@postgres:5432/cairn
      CAIRN_ENCRYPTION_KEY: ${CAIRN_ENCRYPTION_KEY:?CAIRN_ENCRYPTION_KEY не задан}
      CAIRN_WEB_URL: ${CAIRN_WEB_URL:-http://localhost}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Свой адрес живости: у него нет ни аутентификации, ни обращения к базе.
      # fetch есть в Node 22 — лишних утилит в образе не требуется.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      # Первая сборка NestJS поднимается небыстро; до конца этого срока
      # неудачные проверки не считаются падением.
      start_period: 30s
    restart: unless-stopped

  web:
    image: cairn-web:latest
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      CAIRN_INTERNAL_API_URL: http://api:3001/api
      CAIRN_ALLOW_INSECURE_NO_TOTP: ${CAIRN_ALLOW_INSECURE_NO_TOTP:-}
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # Любой ответ, кроме серверной ошибки, означает, что Next обслуживает
      # запросы: корень отдаёт переадресацию на вход, и это нормальное состояние.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  proxy:
    image: caddy:2-alpine
    ports:
      # Порты вынесены в переменные по той же причине, что и порт базы:
      # на машине разработчика 80 и 443 часто заняты другим прокси.
      - '${CAIRN_HTTP_PORT:-80}:80'
      - '${CAIRN_HTTPS_PORT:-443}:443'
    environment:
      CAIRN_DOMAIN: ${CAIRN_DOMAIN:-localhost}
      # http по умолчанию: на localhost автоматический HTTPS дал бы
      # самоподписанный сертификат и ошибку в браузере.
      CAIRN_SCHEME: ${CAIRN_SCHEME:-http}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  caddy-data:
